<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1020">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>Burnt Kingdoms</title>
  <style>
    :root{
      color-scheme:dark;--bg:#080d18;--surface:#111a2a;--surface2:#172338;
      --line:#273753;--text:#edf3fc;--muted:#9aaac2;--gold:#f6c86b;
      --cyan:#64d6d0;--orange:#ff875d;--green:#65d5a4;--red:#ff7888;
      --shadow:0 18px 45px #02061188
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% -12%,#283b56 0,transparent 40%),radial-gradient(ellipse at 5% 25%,#271c31 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.8 Vazirmatn,Tahoma,sans-serif;padding:12px 12px 92px}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    h1,h2,h3,p{margin-top:0}
    h2{font-size:19px;line-height:1.5;margin:4px 0 14px;color:var(--gold)}
    h3{font-size:15px;margin:0 0 4px}
    small,.muted{color:var(--muted)}
    .wrap{max-width:760px;margin:auto}
    .top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-icon{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f6c86b,#ff875d);color:#172031;font-size:21px;box-shadow:0 8px 24px #ff875d33}
    .brand strong{display:block;font-size:14px;letter-spacing:.2px}
    .brand small{display:block;font-size:10px;line-height:1.2}
    .season-pill{border:1px solid var(--line);background:#0c1524cc;border-radius:99px;padding:5px 10px;color:var(--cyan);font-size:11px}
    .card{background:linear-gradient(145deg,#141f32ee,#101827f2);border:1px solid var(--line);border-radius:19px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
    .hero{position:relative;overflow:hidden;padding:22px 16px;background:linear-gradient(135deg,#1b2a40,#111827 64%,#242033);text-align:center}
    .hero:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff0a;border-radius:50%;top:-120px;left:-45px;box-shadow:0 0 0 24px #ffffff05,0 0 0 48px #ffffff03}
    .hero .flag{font-size:68px;line-height:1.2;filter:drop-shadow(0 8px 16px #0009)}
    .hero h1{font-size:23px;margin:6px 0 0;font-weight:900}
    .hero .greeting{color:var(--gold);font-size:12px}
    .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .stat{border:1px solid #263650;background:#0d1625;border-radius:15px;padding:11px 12px;min-height:78px}
    .stat .label{font-size:11px;color:var(--muted)}
    .stat strong{display:block;margin-top:2px;font-size:18px;line-height:1.5;color:var(--text);font-weight:800}
    .stat em{font-style:normal;color:var(--gold);font-size:10px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
    .section-head b{font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .menu-button{min-height:85px;text-align:right;border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--text);background:linear-gradient(145deg,#16243a,#101827);transition:transform .16s,border-color .16s}
    .menu-button:active,.button:active{transform:scale(.98)}
    .menu-button b{display:block;font-size:14px}
    .menu-button small{display:block;font-size:10px;margin-top:2px}
    .menu-icon{font-size:22px;display:block;margin-bottom:1px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0d1625;border:1px solid #253650;border-radius:14px;padding:10px 11px;margin:8px 0}
    .row-main{min-width:0;flex:1}
    .row-title{font-size:13px;font-weight:700}
    .row small{display:block;font-size:10px;line-height:1.6}
    .row-actions{display:flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:flex-end}
    .button{border:1px solid transparent;border-radius:11px;padding:8px 11px;background:linear-gradient(135deg,#f7cf7a,#e8a94e);color:#182031;font-weight:800;font-size:12px;box-shadow:0 5px 16px #e8a94e1c}
    .button.secondary{background:#18253a;color:var(--cyan);border-color:#314561;box-shadow:none}
    .button.ghost{background:transparent;color:var(--muted);border-color:#31415a;box-shadow:none}
    .button.danger{background:#381d2a;color:#ff9bab;border-color:#673144;box-shadow:none}
    .button.wide{width:100%;padding:12px;margin-top:8px}
    .button:disabled{opacity:.45;cursor:not-allowed}
    input,textarea,select{width:100%;border:1px solid #2b3c58;border-radius:12px;padding:10px 11px;background:#0a1321;color:var(--text);outline:none;margin:5px 0}
    input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #64d6d014}
    input[type=number]{min-width:82px;width:100px}
    textarea{resize:vertical;min-height:90px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .form-grid label,.field-label{font-size:11px;color:var(--muted)}
    .notice{padding:11px 12px;border-radius:13px;background:#172338;border:1px solid #2c405e;color:#b9c9df;font-size:12px;margin:8px 0}
    .notice.warn{background:#302619;border-color:#69502a;color:#f6d48d}
    .notice.good{background:#102b27;border-color:#245c4c;color:#a0ebc7}
    .meter{height:8px;background:#080e18;border-radius:99px;overflow:hidden;margin:7px 1px 1px}
    .meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--gold),var(--green))}
    .pill{display:inline-block;padding:2px 8px;border-radius:99px;color:var(--cyan);background:#123233;border:1px solid #235251;font-size:10px}
    .flag-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .country{border:1px solid #263650;background:#0d1625;border-radius:13px;text-align:center;padding:9px 4px;cursor:pointer;font-size:11px;min-width:0}
    .country span{display:block;font-size:30px;line-height:1.3}
    .country.taken{opacity:.35;pointer-events:none;filter:grayscale(1)}
    .search-wrap{position:relative;margin:10px 0}
    .search-wrap input{padding-right:40px}
    .search-icon{position:absolute;right:13px;top:12px;color:var(--muted)}
    .backline{display:flex;align-items:center;gap:8px;margin:0 0 9px}
    .capacity{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
    .request{border:1px solid #334562;background:#0c1625;border-radius:15px;padding:12px;margin:8px 0}
    .request .request-title{font-weight:800;color:var(--gold)}
    .request p{margin:5px 0;font-size:12px;overflow-wrap:anywhere}
    .empty{text-align:center;padding:18px 10px;color:var(--muted)}
    nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:#09101ceF;border-top:1px solid #263650;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0))}
    nav button{max-width:250px;flex:1;border:0;border-radius:12px;background:transparent;color:var(--muted);padding:9px 4px;font-size:11px}
    nav button.on{color:var(--gold);background:#1a2638;font-weight:800}
    #toast{position:fixed;z-index:10;bottom:82px;left:50%;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#edf3fc;color:#101827;border-radius:12px;padding:8px 14px;font-size:12px;font-weight:700;transition:.2s;max-width:90vw;text-align:center}
    #toast.show{opacity:1;transform:translate(-50%,0)}
    .loading{display:grid;place-items:center;min-height:45vh;color:var(--muted)}
    .spinner{width:27px;height:27px;border:3px solid #33445c;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 9px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(min-width:620px){body{padding:20px 18px 100px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.flag-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.hero .flag{font-size:78px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><div class="brand-icon">🔥</div><div><strong>BURNT KINGDOMS</strong><small>جهان را با تصمیم‌هایت شکل بده</small></div></div>
      <div class="season-pill" id="season-pill">در حال اتصال…</div>
    </header>
    <main id="app"><div class="loading"><div><div class="spinner"></div>در حال بارگذاری…</div></div></main>
  </div>
  <nav id="nav">
    <button data-tab="home">🏠 خانه</button>
    <button data-tab="manage">🏛 مدیریت کشور</button>
    <button data-tab="stmt">📢 بیانیه</button>
  </nav>
  <div id="toast"></div>
<script>
  const tg=window.Telegram?.WebApp;
  tg?.expand();tg?.ready();
  const $=s=>document.querySelector(s);
  const fmt=n=>Math.round(Number(n)||0).toLocaleString('en-US');
  const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const flag=c=>[...String(c||'')].map(x=>String.fromCodePoint(127397+x.charCodeAt())).join('');
  const dn=new Intl.DisplayNames(['fa'],{type:'region'});
  const nm=c=>{try{return dn.of(c)||c}catch{return c}};
  let S=null,tab='home',V='',gate=null,q='',toastTimer=null;
  const hour=()=>+new Intl.DateTimeFormat('en-GB',{hour:'numeric',hour12:false,timeZone:'Asia/Tehran'}).format(new Date())%24;
  const greet=()=>{const h=hour();return h>=5&&h<12?'صبح بخیر ☀️':h>=12&&h<18?'عصر بخیر 🌇':'شب بخیر 🌙'};
  function toast(text){const e=$('#toast');e.textContent=text;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2600)}
  function alertUser(text){if(tg?.showAlert)tg.showAlert(text);else window.alert(text)}
  async function call(action,data={}){
    try{
      const response=await fetch('/api/'+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,init:tg?.initData||''})});
      const result=await response.json();
      if(result.gate)gate=result.gate;else if(result.s)gate=null;
      if(result.s)S=result.s;
      if(result.err)alertUser(result.err);
      else if(action!=='state')toast(action==='stmt'?'بیانیه در کانال منتشر شد.':'تغییر با موفقیت ثبت شد.');
    }catch(error){console.error(error);alertUser('ارتباط با سرور برقرار نشد.')}
    render();
  }
  const btn=(text,handler,kind='')=>`<button class="button ${kind}" onclick="${handler}">${text}</button>`;
  const back=()=>{V=V.split('.').slice(0,-1).join('.');render()};
  const backline=()=>V?`<div class="backline">${btn('← بازگشت','back()','ghost')}<span class="muted">مدیریت کشور</span></div>`:'';
  const val=id=>document.getElementById(id)?.value||'';
  const act=(action,data)=>call(action,data);
  const seasonLabels={wait:'در انتظار شروع',pick:'انتخاب کشور',live:'سیزن فعال'};

  function searchCountries(value){
    q=value;
    const old=$('#country-search');const pos=old?.selectionStart??q.length;
    render();
    const input=$('#country-search');
    if(input){input.focus();input.setSelectionRange(pos,pos)}
  }
  function pick(){
    const list=(S.C||[]).map(c=>({c,n:nm(c)})).filter(x=>!q||x.n.toLowerCase().includes(q.toLowerCase())||x.c.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.n.localeCompare(b.n,'fa'));
    return `<section class="card"><h2>🗺️ انتخاب کشور</h2><p class="muted">کشور را انتخاب کنید؛ پس از انتخاب قابل تغییر نیست.</p><div class="search-wrap"><span class="search-icon">⌕</span><input id="country-search" placeholder="نام یا کد کشور را جستجو کنید…" value="${esc(q)}" oninput="searchCountries(this.value)"></div><div class="flag-grid">${list.map(x=>`<div class="country ${S.taken.includes(x.c)?'taken':''}" onclick="confirmCountry('${x.c}')"><span>${flag(x.c)}</span>${esc(x.n)}</div>`).join('')||'<div class="empty">کشوری با این جستجو پیدا نشد.</div>'}</div></section>`;
  }
  function confirmCountry(code){
    const run=ok=>ok&&act('pick',{c:code});
    if(tg?.showConfirm)tg.showConfirm(`کشور ${nm(code)} را انتخاب می‌کنید؟ این انتخاب قابل تغییر نیست.`,run);
    else if(confirm(`کشور ${nm(code)} را انتخاب می‌کنید؟`))run(true);
  }
  function stat(label,value,note=''){return `<div class="stat"><div class="label">${label}</div><strong>${value}</strong>${note?`<em>${note}</em>`:''}</div>`}
  function home(p){
    const troopCount=Object.values(p.u||{}).reduce((a,b)=>a+(Number(b)||0),0);
    const dailyIncome=Object.entries(p.b||{}).reduce((sum,[k,n])=>sum+(S.B[k]?.income||0)*n,0);
    return `<section class="card hero"><div class="greeting">${greet()}، فرمانروا</div><h1>${esc(nm(p.c))}</h1><div class="flag">${flag(p.c)}</div><div class="pill">${p.alive?'کشور پایدار':'حکومت سقوط کرده'}</div></section>
      <div class="stats">${stat('🏛 قدرت سیاسی',fmt(p.pp))}${stat('💵 خزانه',fmt(p.money),'دلار')}${stat('🌾 ذخیره غذا',fmt(p.food))}${stat('😊 رضایت مردم',Math.round(p.happy)+'٪')}${stat('🪖 مجموع نیروها',fmt(troopCount))}${stat('📦 انبار',`${fmt(S.used)} / ${fmt(S.cap)}`)}${stat('🏦 سپرده بانکی',fmt(p.vault||0),'دلار')}${stat('💹 درآمد روزانه',fmt(dailyIncome),'دلار')}</div>
      <div class="meter"><i style="width:${Math.max(0,Math.min(100,p.happy))}%"></i></div>
      ${p.happy<20?'<div class="notice warn">🔥 رضایت پایین است؛ کشور در آستانه بحران قرار دارد.</div>':''}
      ${S.incoming?.length?`<div class="notice good">📨 ${S.incoming.length} پیشنهاد دیپلماتیک در انتظار پاسخ شماست.</div>`:''}
      <div class="section-head"><b>نمای کلی کشور</b><span class="muted">به‌روزرسانی زنده</span></div>
      <section class="card"><div class="capacity"><span>😊 رضایت عمومی</span><b>${Math.round(p.happy)}٪</b></div><div class="meter"><i style="width:${Math.max(0,Math.min(100,p.happy))}%"></i></div><div class="capacity" style="margin-top:12px"><span>📦 ظرفیت انبار تسلیحات</span><b>${fmt(S.used)} از ${fmt(S.cap)}</b></div><div class="meter"><i style="width:${S.cap?Math.min(100,S.used/S.cap*100):0}%;background:linear-gradient(90deg,var(--cyan),#858cff)"></i></div></section>`;
  }
  function menuItem(icon,title,sub,path){return `<button class="menu-button" onclick="go('${path}')"><span class="menu-icon">${icon}</span><b>${title}</b><small>${sub}</small></button>`}
  function go(path){V=path;render()}
  function relationPanel(player,country){
    const badges=[];
    if(player.embassies?.includes(country))badges.push('سفارت ما فعال است');
    if(player.hosted_embassies?.includes(country))badges.push('ما میزبان سفارت این کشور هستیم');
    if(player.access?.includes(country))badges.push('دسترسی نظامی ما فعال است');
    if(player.access_grants?.includes(country))badges.push('به این کشور دسترسی نظامی داده‌ایم');
    const history=(player.diplomacy_log||[]).filter(item=>item.country===country).slice(-4).reverse();
    const names={trade:'تجارت انجام شد',talk:'مذاکره ثبت شد',embassy:'سفارت تأسیس شد',hosted_embassy:'سفارت دریافت شد',access:'دسترسی نظامی دریافت شد',access_grant:'دسترسی نظامی اعطا شد',bank_transfer:'انتقال بانکی انجام شد'};
    return `<div class="card">${badges.length?`<div class="row-actions">${badges.map(label=>`<span class="pill">${label}</span>`).join('')}</div>`:'<span class="muted">هنوز توافقی با این کشور ثبت نشده است.</span>'}${history.length?`<div class="section-head"><b>توافق‌های اخیر</b></div>${history.map(item=>`<div class="row"><div class="row-main"><div class="row-title">${names[item.kind]||'روابط دیپلماتیک'}</div><small>${esc(item.message||'')} · ${new Date(item.time*1000).toLocaleDateString('fa-IR')}</small></div></div>`).join('')}`:''}</div>`;
  }
  function manage(p){
    if(!V)return `<h2>🏛 مدیریت کشور</h2><div class="grid">
      ${menuItem('🤝','دیپلماسی','تجارت، مذاکره، سفارت و دسترسی نظامی','dip')}
      ${menuItem('💰','اقتصاد و رفاه','درآمد، بانک، مالیات و غذا','eco')}
      ${menuItem('🎖️','نیروهای نظامی','بازار آزاد و کارخانه‌های تولید','mil')}
      ${menuItem('🧠','تکنولوژی','تحقیق و بازکردن قابلیت‌ها','tech')}
      ${menuItem('🌐','سازمان‌های بین‌المللی','مجوزها و زیرساخت تجارت','un')}
      ${menuItem('📨','درخواست‌ها',`${S.incoming.length} ورودی · ${S.outgoing.length} در انتظار`,'requests')}
      ${menuItem('💬','بازخورد','ارسال پیشنهاد برای مدیریت','fb')}
    </div>`;
    const parts=V.split('.'),section=parts[0],sub=parts[1];
    let h=backline();
    const buildings=category=>Object.entries(S.B).filter(([,d])=>d.cat===category).map(([key,d])=>{
      const count=p.b[key]||0;
      const details=[d.income?`درآمد روزانه ${fmt(d.income)}$`:null,d.food?`غذا +${fmt(d.food)} در روز`:null,d.happy?`رضایت +${d.happy}`:null,d.cap?`ظرفیت +${fmt(d.cap)}`:null,d.fee_discount?`تخفیف کارمزد ${Math.round(d.fee_discount*100)}٪`:null].filter(Boolean).join(' · ');
      const isUnique=(key==='bank'||key==='port'||key==='airport')&&count>0;
      return `<div class="row"><div class="row-main"><div class="row-title">${esc(d.fa)} <span class="muted">(${count})</span></div><small>هزینه ${fmt(d.cost)}$${details?' · '+details:''}</small></div><div class="row-actions">${btn(isUnique?'ساخته شده':'ساخت',`act('build',{id:'${key}'})`,isUnique?'ghost':'')}</div></div>`;
    }).join('');

    if(section==='eco'){
      if(!sub)return h+`<h2>💰 اقتصاد و رفاهیات</h2><div class="grid">
        ${menuItem('🏭','کارخانه‌ها','درآمد روزانه کشور','eco.factory')}
        ${menuItem('🏦','بانک ملی',p.b.bank?'خزانه، سپرده، سود و وام':'ساخت بانک و فعال‌کردن خدمات','eco.bank')}
        ${menuItem('🍞','صنعت غذا','مزرعه و امنیت غذایی','eco.food')}
        ${menuItem('🌳','رفاهیات','افزایش رضایت عمومی','eco.welfare')}
        ${menuItem('🧾','مالیات','روزی یک بار','eco.tax')}
      </div>`;
      if(sub==='factory')return h+`<h2>🏭 کارخانه‌های اقتصادی</h2><div class="notice">هزینه‌ی راه‌اندازی کمتر از درآمد روزانه است. درآمد در تسویه‌ی روزانه‌ی سیزن پرداخت می‌شود.</div>${buildings('factory')}`;
      if(sub==='food')return h+`<h2>🍞 صنعت غذا</h2><div class="notice">مزارع روزانه غذا تولید می‌کنند. کمبود غذا رضایت را کاهش می‌دهد.</div>${buildings('food')}`;
      if(sub==='welfare')return h+`<h2>🌳 رفاهیات</h2><div class="notice">ساختمان‌های رفاهی رضایت عمومی را هر روز تقویت می‌کنند.</div>${buildings('welfare')}`;
      if(sub==='tax')return h+`<h2>🧾 مالیات</h2><div class="notice warn">دریافت روزانه <b>۳۵٬۰۰۰$</b> مالیات، رضایت را <b>۴٪</b> کم می‌کند. رضایت زیر ۲۰٪ کشور را وارد بحران می‌کند.</div>${btn('دریافت مالیات امروز',"act('tax')",'wide')}`;
      if(sub==='bank')return bankPage(h,p);
    }
    if(section==='mil'){
      const branches={land:'🪖 نیروی زمینی',air:'✈️ نیروی هوایی',navy:'🚢 نیروی دریایی'};
      if(!sub)return h+`<h2>🎖️ نظامی</h2><div class="notice ${S.open?'good':'warn'}">بازار تسلیحات ${S.open?'اکنون باز است':'اکنون بسته است'} · ساعت کار ۸ تا ۲۲ تهران</div><div class="grid">
        ${Object.entries(branches).map(([key,label])=>menuItem(label.split(' ')[0],label.split(' ').slice(1).join(' '),'خرید از بازار یا تولید داخلی',`mil.${key}`)).join('')}
        ${menuItem('📦','انبار تسلیحات',`${fmt(S.used)} از ${fmt(S.cap)} ظرفیت`,'mil.ars')}
      </div>`;
      if(sub==='ars')return h+`<h2>📦 انبار تسلیحات</h2><div class="card"><div class="capacity"><span>ظرفیت مصرف‌شده</span><b>${fmt(S.used)} / ${fmt(S.cap)}</b></div><div class="meter"><i style="width:${S.cap?Math.min(100,S.used/S.cap*100):0}%"></i></div><p class="muted">کارخانه‌های نظامی برای تولید به فضای خالی انبار نیاز دارند؛ وقتی انبار پر باشد تولید متوقف می‌شود.</p></div>${buildings('mil')}`;
      if(branches[sub])return h+`<h2>${branches[sub]}</h2><div class="notice ${S.open?'good':'warn'}">${S.open?'🟢 بازار آزاد باز است':'🔴 بازار آزاد بسته است'} · کارخانه‌ها حتی هنگام بسته‌بودن بازار تولید می‌کنند.</div>${Object.entries(S.U).filter(([,unit])=>unit.br===sub).map(([key,unit])=>{
        const locked=unit.lock&&!p.nuke_ok,owned=p.u[key]||0,factories=p.mf[key]||0;
        return `<div class="row ${locked?'locked':''}"><div class="row-main"><div class="row-title">${locked?'🔒 ':''}${esc(unit.fa)} <span class="muted">× ${fmt(owned)}</span></div><small>${locked?'پس از اخذ مجوز قابل دسترسی است':`قیمت ${fmt(unit.cost)}$ · حمله ${unit.atk} · دفاع ${unit.df}<br>کارخانه ${factories} · تولید ${fmt(unit.rate)} در روز`}</small></div>${locked?'<span class="pill">قفل</span>':`<div class="row-actions"><input aria-label="تعداد خرید" type="number" id="buy_${key}" value="1" min="1" max="5000">${btn('خرید',`act('buy',{id:'${key}',n:val('buy_${key}')})`)}${btn('کارخانه',`act('mf',{id:'${key}'})`,'secondary')}</div>`}</div>`;
      }).join('')}`;
    }
    if(section==='dip'){
      if(!sub)return h+`<h2>🤝 دیپلماسی</h2><div class="notice">پیشنهادها مستقیماً برای کشور مقصد ارسال می‌شوند و با پذیرش آن اجرا خواهند شد.</div>${requestList()}<div class="section-head"><b>کشورهای دیگر</b><span class="muted">${S.others.length} کشور</span></div>${S.others.length?S.others.map(c=>`<div class="row"><div class="row-main"><div class="row-title">${flag(c)} ${esc(nm(c))}</div><small>${p.embassies.includes(c)?'سفارت ما فعال':p.hosted_embassies.includes(c)?'میزبان سفارت':p.access.includes(c)?'دسترسی نظامی فعال':p.access_grants.includes(c)?'دسترسی نظامی داده‌شده':'روابط دیپلماتیک'}</small></div>${btn('بررسی روابط',`go('dip.${c}')`)}</div>`).join(''):'<div class="empty">هنوز کشور دیگری وارد سیزن نشده است.</div>'}`;
      const country=sub;
      if(parts.length===2)return h+`<h2>${flag(country)} ${esc(nm(country))}</h2>${relationPanel(p,country)}<div class="grid">
        ${menuItem('💬','مذاکره','ارسال پیام دیپلماتیک',`dip.${country}.talk`)}
        ${menuItem('📦','تجارت','مبادله‌ی تجهیزات یا پول',`dip.${country}.trade`)}
        ${menuItem('🏛️','تأسیس سفارت','با موافقت کشور مقصد',`dip.${country}.embassy`)}
        ${menuItem('🛡️','دسترسی نظامی','درخواست مجوز عبور یا استقرار',`dip.${country}.access`)}
        ${menuItem('🏦','انتقال پول','با تأیید گیرنده · سقف روزانه ${fmt(S.bank_limit)}$',`dip.${country}.transfer`)}
      </div>`;
      if(sub==='talk')return h+`<h2>💬 مذاکره با ${esc(nm(country))}</h2><div class="notice">پیام شما به کشور مقصد ارسال می‌شود؛ پذیرش ثبت می‌کند که مذاکره انجام شده است.</div><textarea id="talk-text" maxlength="800" placeholder="متن درخواست یا موضوع مذاکره"></textarea>${btn('ارسال درخواست مذاکره',`act('diplomacy',{kind:'talk',c:'${country}',text:val('talk-text')})`,'wide')}`;
      if(sub==='embassy')return h+`<h2>🏛️ درخواست تأسیس سفارت</h2><div class="notice">پس از پذیرش کشور مقصد، سفارت ثبت می‌شود و هزینه‌ی آن ۱۰ قدرت سیاسی است.</div><textarea id="embassy-text" maxlength="800" placeholder="پیام همراه درخواست (اختیاری)"></textarea>${btn('ارسال درخواست سفارت',`act('diplomacy',{kind:'embassy',c:'${country}',text:val('embassy-text')})`,'wide')}`;
      if(sub==='access')return h+`<h2>🛡️ درخواست دسترسی نظامی</h2><div class="notice">برای عبور یا استقرار نیرو در خاک کشور مقصد درخواست دهید. با پذیرش، دسترسی در روابط کشور شما ثبت می‌شود؛ هزینه ۸ قدرت سیاسی است.</div><textarea id="access-text" maxlength="800" placeholder="محدوده و مدت دسترسی درخواستی"></textarea>${btn('ارسال درخواست دسترسی',`act('diplomacy',{kind:'access',c:'${country}',text:val('access-text')})`,'wide')}`;
      if(sub==='transfer')return h+`<h2>🏦 انتقال پول به ${esc(nm(country))}</h2><div class="notice">هر دو کشور باید بانک داشته باشند. گیرنده انتقال را تأیید می‌کند؛ سقف روزانه شما ${fmt(S.bank_limit)}$ است.</div><label class="field-label">مبلغ (دلار)</label><input id="transfer-amount" type="number" min="1000" max="${S.bank_limit}" value="10000"><label class="field-label">یادداشت (اختیاری)</label><input id="transfer-text" maxlength="300" placeholder="توضیح کوتاه"><button class="button wide" onclick="act('bank_transfer',{c:'${country}',amount:val('transfer-amount'),text:val('transfer-text')})">ارسال درخواست انتقال</button>`;
      if(sub==='trade')return tradePage(h,country,p);
    }
    if(section==='requests')return h+`<h2>📨 درخواست‌های دیپلماتیک</h2>${requestList(true)}`;
    if(section==='tech')return h+`<h2>🧠 تکنولوژی</h2><div class="notice">تحقیقات فناوری به قدرت سیاسی و بودجه نیاز دارد و بعضی مسیرها پیش‌نیاز دارند.</div>${Object.entries(S.T).map(([key,tech])=>`<div class="row"><div class="row-main"><div class="row-title">${p.t.includes(key)?'✅ ':''}${esc(tech.fa)}</div><small>${fmt(tech.pp)} قدرت سیاسی · ${fmt(tech.money)}$${tech.req?' · پیش‌نیاز: '+esc(S.T[tech.req].fa):''}</small></div>${p.t.includes(key)?'<span class="pill">تکمیل</span>':btn('تحقیق',`act('tech',{id:'${key}'})`)}</div>`).join('')}`;
    if(section==='un'){
      if(!sub)return h+`<h2>🌐 دفتر سازمان‌های بین‌المللی</h2><div class="grid">${menuItem('⚛️','سازمان انرژی اتمی','مجوز ساخت تجهیزات هسته‌ای','un.iaea')}${menuItem('🚢','سازمان تجارت جهانی','بندر و فرودگاه تجاری','un.wto')}</div>`;
      if(sub==='wto')return h+`<h2>🚢 زیرساخت تجارت جهانی</h2><div class="notice">بندر و فرودگاه خودشان درآمد ندارند؛ برای تجارت تجهیزات بین کشورها پیش‌نیازند و کارمزد معامله را پایین می‌آورند.</div>${buildings('logistics')}`;
      return h+`<h2>⚛️ سازمان انرژی اتمی</h2><div class="notice ${p.nuke_ok?'good':'warn'}">${p.nuke_ok?'☢️ مجوز تولید تجهیزات هسته‌ای فعال است.':'برای درخواست مجوز، تحقیقات هسته‌ای و غنی‌سازی را کامل کنید.'}</div>${p.nuke_ok?'':`<textarea id="nuke-text" maxlength="800" placeholder="درخواست مجوز را توضیح دهید (حداقل ۲۰ حرف)"></textarea>${btn('ارسال درخواست به ادمین',`act('nuke',{text:val('nuke-text')})`,'wide')}`}`;
    }
    if(section==='fb')return h+`<h2>💬 بازخورد</h2><textarea id="feedback" maxlength="1000" placeholder="پیشنهاد یا گزارش خود را بنویسید"></textarea>${btn('ارسال بازخورد',`act('note',{text:val('feedback')})`,'wide')}`;
    return h+'<div class="empty">بخش پیدا نشد.</div>';
  }
  function bankPage(h,p){
    if(!p.b.bank)return h+`<h2>🏦 بانک ملی</h2><div class="notice">بانک روزانه درآمد ثابت دارد، روی سپرده سود مرکب ۰٫۵٪ می‌دهد و خدمات انتقال پول و وام را فعال می‌کند.</div>${Object.entries(S.B).filter(([k])=>k==='bank').map(([key,d])=>`<div class="row"><div class="row-main"><div class="row-title">${esc(d.fa)}</div><small>هزینه ${fmt(d.cost)}$ · درآمد روزانه ${fmt(d.income)}$</small></div>${btn('تأسیس بانک',`act('build',{id:'${key}'})`)}</div>`).join('')}`;
    return h+`<h2>🏦 بانک ملی</h2><div class="stats">${stat('💵 پول نقد',fmt(p.money))}${stat('🏦 سپرده',fmt(p.vault||0))}${stat('📈 وام فعال',fmt(p.loan||0))}${stat('💹 درآمد ثابت روزانه','36,000$')}</div><div class="notice good">سود سپرده روزانه ۰٫۵٪ به موجودی بانک افزوده می‌شود. وام تا ${fmt(S.bank_limit)}$؛ بازپرداخت هر روز از خزانه کسر می‌شود.</div><div class="card"><h3>واریز و برداشت</h3><label class="field-label">مبلغ (۱٬۰۰۰ تا ۲۵۰٬۰۰۰ دلار)</label><input id="bank-amount" type="number" min="1000" max="250000" value="10000"><div class="row-actions">${btn('واریز به سپرده',`act('bank',{kind:'deposit',amount:val('bank-amount')})`)}${btn('برداشت',`act('bank',{kind:'withdraw',amount:val('bank-amount')})`,'secondary')}</div></div><div class="card"><h3>وام</h3><p class="muted">بازپرداخت روزانه شامل ۰٫۵٪ سود و بخشی از اصل وام است.</p><div class="row-actions">${btn('دریافت وام',`act('bank',{kind:'loan',amount:val('bank-amount')})`,'secondary')}${btn('بازپرداخت',`act('bank',{kind:'repay',amount:val('bank-amount')})`,'ghost')}</div></div>`;
  }
  function assetOptions(player,mode){
    return `<option value="money">💵 پول</option>`+Object.entries(S.U).filter(([key])=>mode==='give'?(Number(player.u[key]||0)>0):true).map(([key,u])=>`<option value="${key}">${esc(u.fa)}</option>`).join('');
  }
  function tradePage(h,country,p){
    return h+`<h2>📦 تجارت با ${esc(nm(country))}</h2><div class="notice">برای تجارت ادوات، هر دو کشور باید بندر یا فرودگاه داشته باشند؛ این زیرساخت‌ها درآمد ندارند اما کارمزد را کم می‌کنند. معامله با پذیرش مقصد انجام می‌شود. هزینه ثبت پیشنهاد ${S.TP} قدرت سیاسی است.</div><div class="card"><label class="field-label">آنچه پیشنهاد می‌دهید</label><div class="form-grid"><select id="give-id">${assetOptions(p,'give')}</select><input id="give-amount" type="number" min="1" value="1"></div><label class="field-label">آنچه درخواست می‌کنید</label><div class="form-grid"><select id="want-id">${assetOptions(p,'want')}</select><input id="want-amount" type="number" min="1" value="1"></div><label class="field-label">یادداشت (اختیاری)</label><input id="trade-text" maxlength="300" placeholder="شرایط یا توضیح معامله"><button class="button wide" onclick="submitTrade('${country}')">ارسال پیشنهاد تجارت</button></div>`;
  }
  function submitTrade(country){
    const giveId=val('give-id'),wantId=val('want-id');
    act('diplomacy',{kind:'trade',c:country,give_kind:giveId==='money'?'money':'unit',give_id:giveId,give_amount:val('give-amount'),want_kind:wantId==='money'?'money':'unit',want_id:wantId,want_amount:val('want-amount'),text:val('trade-text')});
  }
  const requestNames={trade:'پیشنهاد تجارت',talk:'درخواست مذاکره',embassy:'درخواست سفارت',access:'دسترسی نظامی',bank_transfer:'انتقال بانکی'};
  function requestCard(item,incoming){
    const trade=item.give?`<p>پیشنهاد: ${esc(assetName(item.give))}<br>درخواست: ${esc(assetName(item.want))}<br>کارمزد: ${fmt(item.fee)}$</p>`:'';
    const amount=item.amount?`<p>مبلغ: ${fmt(item.amount)}$</p>`:'';
    return `<div class="request"><div class="request-title">${incoming?`از ${flag(item.from)} ${esc(nm(item.from))}`:`به ${flag(item.to)} ${esc(nm(item.to))}`} · ${requestNames[item.kind]||'درخواست'}</div>${item.message?`<p>${esc(item.message)}</p>`:''}${trade}${amount}${incoming?`<div class="row-actions">${btn('پذیرفتن',`act('respond',{id:${item.id},answer:'yes'})`)}${btn('رد کردن',`act('respond',{id:${item.id},answer:'no'})`,'danger')}</div>`:'<span class="pill">در انتظار پاسخ</span>'}</div>`;
  }
  function assetName(asset){
    if(!asset)return '—';
    if(asset.kind==='money')return `${fmt(asset.amount)}$`;
    return `${fmt(asset.amount)} × ${S.U[asset.id]?.fa||asset.id}`;
  }
  function requestList(only=false){
    const incoming=S.incoming||[],outgoing=S.outgoing||[];
    return `${incoming.length?`<div class="section-head"><b>درخواست‌های ورودی</b><span class="pill">${incoming.length}</span></div>${incoming.map(x=>requestCard(x,true)).join('')}`:'<div class="empty">درخواست ورودیِ در انتظاری ندارید.</div>'}${outgoing.length?`<div class="section-head"><b>پیشنهادهای ارسالی</b></div>${outgoing.map(x=>requestCard(x,false)).join('')}`:''}`;
  }
  function statement(){
    return `<h2>📢 صدور بیانیه</h2><div class="notice good">بیانیه پس از ثبت، مستقیم در کانال منتشر می‌شود و نیاز به تأیید ادمین ندارد. برای جلوگیری از اسپم، فاصله‌ی ۱۵ دقیقه‌ای و سقف ۵ بیانیه در روز اعمال می‌شود.</div><textarea id="statement-text" maxlength="850" rows="5" placeholder="متن بیانیه رسمی کشور"></textarea><label class="field-label">لینک تصویر (اختیاری، HTTPS)</label><input id="statement-image" type="url" placeholder="https://example.com/image.jpg"><button class="button wide" onclick="act('stmt',{text:val('statement-text'),img:val('statement-image')})">انتشار بیانیه در کانال</button>`;
  }
  function render(){
    document.querySelectorAll('nav button').forEach(button=>button.classList.toggle('on',button.dataset.tab===tab));
    const app=$('#app'),pill=$('#season-pill');
    if(gate){pill.textContent='عضویت لازم است';app.innerHTML=`<section class="card hero"><div class="brand-icon" style="margin:auto">🔥</div><h1>ورود به بازی</h1><p>برای بازی باید عضو چت و کانال باشید.</p>${gate.map(chat=>btn(esc(chat),`tg?.openTelegramLink?.('https://t.me/${encodeURIComponent(chat.replace('@',''))}')`,'secondary')).join('<br>')}<br>${btn('✅ عضو شدم','call("state")','wide')}</section>`;return}
    if(!S){app.innerHTML='<div class="loading"><div><div class="spinner"></div>در حال بارگذاری…</div></div>';return}
    pill.textContent=seasonLabels[S.season]||'Burnt Kingdoms';
    const p=S.p;
    if(!p){app.innerHTML=S.season==='wait'?'<section class="card hero"><div class="flag">⏳</div><h1>سیزن هنوز شروع نشده</h1><p class="muted">پس از اعلام مرحله‌ی کشورگیری، کشور خود را انتخاب کنید.</p></section>':pick();return}
    if(!p.alive){app.innerHTML='<section class="card hero"><div class="flag">💀</div><h1>حکومت سقوط کرد</h1><p class="muted">کشور شما دیگر در این سیزن فعال نیست.</p></section>';return}
    if(S.season!=='live'&&tab!=='home'){app.innerHTML='<section class="card hero"><div class="flag">⏳</div><h1>سیزن هنوز فعال نشده</h1><p class="muted">بخش مدیریت پس از شروع سیزن فعال می‌شود.</p></section>';return}
    app.innerHTML=tab==='home'?home(p):tab==='manage'?manage(p):statement();
  }
  document.querySelectorAll('nav button').forEach(button=>button.addEventListener('click',()=>{tab=button.dataset.tab;V='';render()}));
  window.back=back;window.go=go;window.searchCountries=searchCountries;window.confirmCountry=confirmCountry;
  window.call=call;window.act=act;window.val=val;window.submitTrade=submitTrade;
  window.tg=tg;window.render=render;
  call('state');
</script>
</body>
</html>
